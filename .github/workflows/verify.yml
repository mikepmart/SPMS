# Project: Simulated Patient Monitoring System (SPMS)
# Project Author: Michael Mart | Prepared by Codex
# File: .github/workflows/verify.yml
# Purpose: Verify locked Phase 1 development scaffolds and archive actual evidence.
# Responsibilities: Quality, tests, statement coverage, scans and exact SBOMs.
# Requirements: QA-001–008, SEC-007/008, DOC-002 (supporting process only).
# Controls: RC-CYB-007 (supporting tooling, not complete control verification).
name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  UV_PYTHON_DOWNLOADS: never

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install pinned uv and locked environment
        run: |
          python -m pip install "uv==$(cat .uv-version)"
          uv sync --locked --project backend
      - name: Python formatting
        working-directory: backend
        run: uv run --locked ruff format --check .
      - name: Python lint
        working-directory: backend
        run: uv run --locked ruff check .
      - name: Python strict types
        working-directory: backend
        run: uv run --locked mypy
      - name: Unit, integration and negative security smoke tests
        working-directory: backend
        run: >-
          uv run --locked pytest -q
          --junitxml=../artifacts/backend/junit.xml
          --cov=spms --cov-branch --cov-report=term-missing
          --cov-report=json:../artifacts/backend/coverage.json
          --cov-report=xml:../artifacts/backend/coverage.xml
      - name: Gate statements at 90 percent and report branches separately
        working-directory: backend
        run: uv run --locked python tools/check_coverage.py ../artifacts/backend/coverage.json | tee ../artifacts/backend/coverage-gate.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/backend/
          if-no-files-found: error
          retention-days: 30

  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify package manager and install locked dependencies
        working-directory: frontend
        run: |
          test "$(npm --version)" = "11.19.0"
          npm ci
      - name: Frontend formatting
        working-directory: frontend
        run: npm run format:check
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: TypeScript strict types
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend unit tests and measured coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Production build
        working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/frontend/
          if-no-files-found: error
          retention-days: 30

  browser:
    name: Chromium smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Locked installs
        run: |
          python -m pip install "uv==$(cat .uv-version)"
          uv sync --locked --project backend
          npm ci --prefix frontend --ignore-scripts
      - name: Build and install pinned Chromium
        working-directory: frontend
        run: |
          npm run build
          npx --no-install playwright install --with-deps chromium
      - name: Test real loopback HTTP applications
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: chromium-${{ github.sha }}
          path: artifacts/browser/
          if-no-files-found: error
          retention-days: 30

  security:
    name: Dependencies, static security and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Locked installs
        run: |
          python -m pip install "uv==$(cat .uv-version)"
          uv sync --locked --project backend
          npm ci --prefix frontend --ignore-scripts
          mkdir -p artifacts/security
      - name: Audit exact Python runtime and development dependencies
        working-directory: backend
        run: |
          uv export --quiet --locked --all-groups --no-emit-project -o ../artifacts/security/python-requirements.txt
          uv run --locked pip-audit -r ../artifacts/security/python-requirements.txt --require-hashes --disable-pip --strict --format json --output ../artifacts/security/python-audit.json
      - name: Audit npm runtime and development dependencies at every severity
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm audit --json > ../artifacts/security/npm-audit.json
      - name: Python application and verification-tool static security
        if: ${{ !cancelled() }}
        working-directory: backend
        run: uv run --locked bandit -r src tools -f json -o ../artifacts/security/bandit.json
      - name: Exact installed Python environment SBOM
        if: ${{ !cancelled() }}
        working-directory: backend
        run: uv run --locked cyclonedx-py environment --pyproject pyproject.toml --output-reproducible --of JSON -o ../artifacts/security/backend-sbom.json
      - name: Exact npm lock and installed dependencies SBOM
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-${{ github.sha }}
          path: artifacts/security/
          if-no-files-found: error
          retention-days: 30

  secrets:
    name: Git history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download pinned scanner and verify official archive checksum
        run: |
          version="$(cat .gitleaks-version)"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          mkdir -p artifacts/security "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location "$base/$archive" -o "$archive"
          curl --fail --silent --show-error --location "$base/gitleaks_${version}_checksums.txt" -o checksums.txt
          grep "  $archive$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: Scan complete Git history with redacted report
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git . --redact --report-format json --report-path artifacts/security/secrets.json'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: secrets-${{ github.sha }}
          path: artifacts/security/secrets.json
          if-no-files-found: error
          retention-days: 30
